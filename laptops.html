<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptops | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/storefront.css">
    <link rel="stylesheet" href="css/pages/laptops.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a>
                <span>/</span>
                <span>Laptops</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-header">
            <h1>Laptops</h1>
            <p>Discover powerful, portable, and premium laptops for work, gaming, and creativity. Find the perfect
                device to match your needs.</p>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Sort By</label>
                    <select class="filter-select" data-filter="sort">
                        <option value="">Featured</option>
                        <option value="rating">Customer Rating</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name">Name: A-Z</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Brand</label>
                    <select class="filter-select" data-filter="brand">
                        <option value="">All Brands</option>
                        <option value="apple">Apple</option>
                        <option value="dell">Dell</option>
                        <option value="hp">HP</option>
                        <option value="lenovo">Lenovo</option>
                        <option value="asus">ASUS</option>
                        <option value="msi">MSI</option>
                        <option value="acer">Acer</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <select class="filter-select" data-filter="price">
                        <option value="">All Prices</option>
                        <option value="under500">Under $500</option>
                        <option value="500-1000">$500 - $1000</option>
                        <option value="1000-1500">$1000 - $1500</option>
                        <option value="1500-2000">$1500 - $2000</option>
                        <option value="over2000">Over $2000</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>CPU</label>
                    <select class="filter-select" data-filter="cpu">
                        <option value="">All Processors</option>
                        <option value="i3">Intel Core i3</option>
                        <option value="i5">Intel Core i5</option>
                        <option value="i7">Intel Core i7</option>
                        <option value="i9">Intel Core i9</option>
                        <option value="ryzen5">AMD Ryzen 5</option>
                        <option value="ryzen7">AMD Ryzen 7</option>
                        <option value="ryzen9">AMD Ryzen 9</option>
                        <option value="m1m2">Apple M1/M2</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>RAM</label>
                    <select class="filter-select" data-filter="ram">
                        <option value="">All Memory</option>
                        <option value="8GB">8GB</option>
                        <option value="16GB">16GB</option>
                        <option value="32GB">32GB</option>
                        <option value="64GB">64GB</option>
                    </select>
                </div>
            </div>
        </div>

        <input type="text" class="product-search" placeholder="Search products across all categories...">
        <div class="product-grid" data-category="laptop"></div>

        <div class="pagination" data-for="laptop-grid"></div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js"></script>
    <script src="notifications.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="navigation.js"></script>
    <script src="js/firebase-api.js"></script>
    <script src="js/products-api.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/chatbot.js"></script>
    <script src="js/pages/storefront.js"></script>
    <script src="js/scroll-reveal.js"></script>
</body>

</html>
