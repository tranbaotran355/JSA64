name = "techstore-chat"
main = "chat-proxy.js"
compatibility_date = "2026-01-01"

# Danh sách origin được phép gọi vào Worker, cách nhau bằng dấu phẩy.
#
# Origin KHÔNG chứa path: trang ở https://tranbaotran355.github.io/JSA64/ gửi
# header `Origin: https://tranbaotran355.github.io`. Đừng thêm `/JSA64/` vào đây.
#
# Bỏ trống = cho phép mọi origin. Chỉ dùng khi dev local, vì mở CORS nghĩa là
# ai biết URL Worker cũng gọi được bằng curl, key sẽ bị tiêu hao.
[vars]
ALLOWED_ORIGINS = "http://localhost:5500,http://127.0.0.1:5500,https://tranbaotran355.github.io"