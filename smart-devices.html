<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Devices | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/storefront.css">
    <link rel="stylesheet" href="css/pages/smart-devices.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a>
                <span>/</span>
                <span>Smart Devices</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Hero intro -->
        <section class="hero-intro">
            <h1>Smart Devices</h1>
            <p>Transform your home and lifestyle with cutting-edge smart technology. From voice-controlled assistants to
                automated security systems, discover devices that connect, automate, and enhance every aspect of your
                daily routine.</p>
        </section>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Sort By</label>
                    <select class="filter-select" data-filter="sort">
                        <option value="">Featured</option>
                        <option value="rating">Customer Rating</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name">Name: A-Z</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Device Type</label>
                    <select class="filter-select" data-filter="type">
                        <option value="">All Types</option>
                        <option value="speaker">Smart Speakers</option>
                        <option value="camera">Security Cameras</option>
                        <option value="lighting">Smart Lighting</option>
                        <option value="thermostat">Thermostats</option>
                        <option value="plug">Smart Plugs</option>
                        <option value="vacuum">Robot Vacuums</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Brand</label>
                    <select class="filter-select" data-filter="brand">
                        <option value="">All Brands</option>
                        <option value="nest">Google Nest</option>
                        <option value="echo">Amazon Echo</option>
                        <option value="homekit">Apple HomeKit</option>
                        <option value="hue">Philips Hue</option>
                        <option value="ring">Ring</option>
                        <option value="ecobee">Ecobee</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <select class="filter-select" data-filter="price">
                        <option value="">All Prices</option>
                        <option value="under100">Under $100</option>
                        <option value="100-250">$100 - $250</option>
                        <option value="250-500">$250 - $500</option>
                        <option value="over500">Over $500</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Connectivity</label>
                    <select class="filter-select" data-filter="connectivity">
                        <option value="">All Connectivity</option>
                        <option value="wifi">Wi-Fi</option>
                        <option value="bluetooth">Bluetooth</option>
                        <option value="zigbee">Zigbee</option>
                        <option value="zwave">Z-Wave</option>
                    </select>
                </div>
            </div>
        </div>

        <input type="text" class="product-search" placeholder="Search products across all categories...">
        <div class="product-grid" data-category="smart device"></div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js?v=2"></script>
    <script src="notifications.js?v=2"></script>
    <script src="cart.js?v=2"></script>
    <script src="auth.js?v=2"></script>
    <script src="navigation.js?v=2"></script>
    <script src="js/firebase-api.js?v=2"></script>
    <script src="js/products-api.js?v=2"></script>
    <script src="js/components/header.js?v=2"></script>
    <script src="js/components/footer.js?v=2"></script>
    <script src="js/components/chatbot.js?v=2"></script>
    <script src="js/pages/storefront.js?v=2"></script>
    <script src="js/scroll-reveal.js?v=2"></script>
</body>

</html>
