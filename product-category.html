<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphones | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/storefront.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a>
                <span>/</span>
                <span>Smartphones</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-header">
            <h1>Smartphones</h1>
            <p>Discover the latest smartphones with cutting-edge technology, powerful cameras, and stunning displays.
            </p>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Sort By</label>
                    <select class="filter-select" data-filter="sort">
                        <option value="">Featured</option>
                        <option value="rating">Customer Rating</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name">Name: A-Z</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Brand</label>
                    <select class="filter-select" data-filter="brand">
                        <option value="">All Brands</option>
                        <option value="apple">Apple</option>
                        <option value="samsung">Samsung</option>
                        <option value="google">Google</option>
                        <option value="oneplus">OnePlus</option>
                        <option value="xiaomi">Xiaomi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <select class="filter-select" data-filter="price">
                        <option value="">All Prices</option>
                        <option value="under500">Under $500</option>
                        <option value="500-1000">$500 - $1000</option>
                        <option value="1000-1500">$1000 - $1500</option>
                        <option value="over1500">Over $1500</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Storage</label>
                    <select class="filter-select" data-filter="storage">
                        <option value="">All Storage</option>
                        <option value="64GB">64GB</option>
                        <option value="128GB">128GB</option>
                        <option value="256GB">256GB</option>
                        <option value="512GB">512GB</option>
                        <option value="1TB">1TB</option>
                    </select>
                </div>
            </div>
        </div>

        <input type="text" class="product-search" placeholder="Search products across all categories...">
        <div class="product-grid" data-category="smartphone"></div>

        <div class="pagination" data-for="smartphone-grid"></div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js"></script>
    <script src="notifications.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="navigation.js"></script>
    <script src="js/firebase-api.js"></script>
    <script src="js/products-api.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/chatbot.js"></script>
    <script src="js/pages/storefront.js"></script>
    <script src="js/scroll-reveal.js"></script>
</body>

</html>
