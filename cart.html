<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/cart.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a>
                <span>/</span>
                <span>Shopping Cart</span>
            </div>
        </div>
    </div>

    <!-- Cart content -->
    <div class="container">
        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <p>Loading...</p>
        </div>

        <div class="cart-container">
            <div class="cart-items"></div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row"><span>Subtotal</span><span>$0.00</span></div>
                <div class="summary-row"><span>Shipping</span><span>$0.00</span></div>
                <div class="summary-row"><span>Tax</span><span>$0.00</span></div>

                <div class="free-shipping">
                    <i class="fas fa-check-circle"></i>
                    Add items to qualify for free shipping
                </div>

                <div class="summary-row total"><span>Total</span><span class="amount">$0.00</span></div>

                <div class="cart-actions">
                    <button class="btn-checkout"><i class="fas fa-lock"></i> Proceed to Checkout</button>
                    <button class="btn-continue">Continue Shopping</button>
                </div>

                <div class="payment-methods">
                    <p>We accept:</p>
                    <div class="payment-icons">
                        <div class="payment-icon"><i class="fab fa-cc-visa"></i></div>
                        <div class="payment-icon"><i class="fab fa-cc-mastercard"></i></div>
                        <div class="payment-icon"><i class="fab fa-cc-amex"></i></div>
                        <div class="payment-icon"><i class="fab fa-cc-paypal"></i></div>
                        <div class="payment-icon"><i class="fab fa-apple-pay"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js"></script>
    <script src="notifications.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="navigation.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/chatbot.js"></script>
    <script src="js/pages/cart.js"></script>
    <script src="js/scroll-reveal.js"></script>
</body>

</html>
