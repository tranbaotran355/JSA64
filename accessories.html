<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/storefront.css">
    <link rel="stylesheet" href="css/pages/accessories.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a>
                <span>/</span>
                <span>Accessories</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-header">
            <h1>Accessories</h1>
            <p>Enhance your devices with premium accessories. From protective cases to powerful chargers, find
                everything you need to complete your tech setup.</p>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Type</label>
                    <select class="filter-select" data-filter="type">
                        <option value="">All Types</option>
                        <option value="audio">Audio & Headphones</option>
                        <option value="charger">Chargers & Cables</option>
                        <option value="case">Cases & Protection</option>
                        <option value="stand">Stands & Mounts</option>
                        <option value="powerbank">Power Banks</option>
                        <option value="phoneacc">Smartphone Accessories</option>
                        <option value="laptopacc">Laptop Accessories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Compatibility</label>
                    <select class="filter-select" data-filter="compatibility">
                        <option value="">All Devices</option>
                        <option value="iphone">iPhone</option>
                        <option value="samsung">Samsung</option>
                        <option value="android">Android Universal</option>
                        <option value="macbook">MacBook</option>
                        <option value="windows">Windows Laptops</option>
                        <option value="universal">Universal</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <select class="filter-select" data-filter="price">
                        <option value="">All Prices</option>
                        <option value="under50">Under $50</option>
                        <option value="50-200">$50 - $100</option>
                        <option value="200-500">$100 - $200</option>
                        <option value="over500">Over $200</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sort By</label>
                    <select class="filter-select" data-filter="sort">
                        <option value="">Featured</option>
                        <option value="rating">Customer Rating</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name">Name: A-Z</option>
                    </select>
                </div>
            </div>
        </div>

        <input type="text" class="product-search" placeholder="Search products across all categories...">
        <div class="product-grid" data-category="accessories"></div>

        <div class="pagination" data-for="accessories-grid"></div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js?v=2"></script>
    <script src="notifications.js?v=2"></script>
    <script src="cart.js?v=2"></script>
    <script src="auth.js?v=2"></script>
    <script src="navigation.js?v=2"></script>
    <script src="js/firebase-api.js?v=2"></script>
    <script src="js/products-api.js?v=2"></script>
    <script src="js/components/header.js?v=2"></script>
    <script src="js/components/footer.js?v=2"></script>
    <script src="js/components/chatbot.js?v=2"></script>
    <script src="js/pages/storefront.js?v=2"></script>
    <script src="js/scroll-reveal.js?v=2"></script>
</body>

</html>
