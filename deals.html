<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals & Offers | TechSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages/storefront.css">
    <link rel="stylesheet" href="css/pages/deals.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="main.html">Home</a><span>/</span><span>Deals & Offers</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Banner flash sale -->
        <div class="deals-banner">
            <div class="banner-content">
                <span class="banner-highlight"><i class="fas fa-bolt"></i> FLASH SALE</span>
                <h1>Up to 50% Off</h1>
                <p>Grab the best tech deals before they're gone. Limited time offer.</p>
                <div class="countdown-timer" id="countdown">
                    <div class="timer-block"><div class="timer-number" id="days">02</div><div class="timer-label">Days</div></div>
                    <div class="timer-block"><div class="timer-number" id="hours">14</div><div class="timer-label">Hours</div></div>
                    <div class="timer-block"><div class="timer-number" id="minutes">35</div><div class="timer-label">Mins</div></div>
                    <div class="timer-block"><div class="timer-number" id="seconds">42</div><div class="timer-label">Secs</div></div>
                </div>
                <a href="#deals-grid" class="banner-cta" style="margin-top: 20px;"><i class="fas fa-tag"></i> Shop Deals</a>
            </div>
            <div style="font-size: 80px; opacity: 0.4;"><i class="fas fa-percent"></i></div>
        </div>

        <!-- Filter & sort bar -->
        <div class="filter-bar">
            <div class="filter-group" style="flex:2;min-width:200px">
                <label><i class="fas fa-search"></i> Search</label>
                <input type="text" class="product-search" placeholder="Search across all deals..." style="width:100%;padding:12px 15px;border:1px solid #d1d5db;border-radius:12px;font-family:'Inter',sans-serif;font-size:15px;background:#fff;outline:none;transition:border-color .2s ease;box-sizing:border-box">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Category</label>
                <select class="filter-select" id="categoryFilter" data-filter="category">
                    <option value="all">All Deals</option>
                    <option value="smartphone">Smartphones</option>
                    <option value="laptop">Laptops</option>
                    <option value="accessories">Accessories</option>
                    <option value="smart device">Smart Devices</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Price Range</label>
                <select class="filter-select" id="priceFilter" data-filter="price">
                    <option value="all">All Prices</option>
                    <option value="under50">Under $50</option>
                    <option value="50-200">$50 - $200</option>
                    <option value="200-500">$200 - $500</option>
                    <option value="over500">Over $500</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By</label>
                <select class="filter-select" id="sortSelect" data-filter="sort">
                    <option value="discount">Biggest Discount</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="newest">Newest</option>
                </select>
            </div>
            <button class="reset-btn" id="resetFilters"><i class="fas fa-undo-alt"></i> Reset</button>
        </div>

        <!-- Lưới sản phẩm giảm giá -->
        <div class="product-grid" id="deals-grid" data-category="all" data-deals="true"></div>

        <div class="pagination" data-for="deals-grid"></div>
    </div>

    <div id="site-footer"></div>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="js/configFirebase.js?v=2"></script>
    <script src="notifications.js?v=2"></script>
    <script src="cart.js?v=2"></script>
    <script src="auth.js?v=2"></script>
    <script src="navigation.js?v=2"></script>
    <script src="js/firebase-api.js?v=2"></script>
    <script src="js/products-api.js?v=2"></script>
    <script src="js/components/header.js?v=2"></script>
    <script src="js/components/footer.js?v=2"></script>
    <script src="js/components/chatbot.js?v=2"></script>
    <script src="js/pages/storefront.js?v=2"></script>
    <script src="js/pages/deals.js?v=2"></script>
    <script src="js/scroll-reveal.js?v=2"></script>
</body>

</html>
